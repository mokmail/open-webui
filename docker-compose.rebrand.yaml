services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.rebrand
    image: open-webui-rebrand:latest
    container_name: open-webui-rebrand
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    volumes:
      - ./data:/app/backend/data
    environment:
      - WEBUI_NAME=${WEBUI_NAME:-Open WebUI}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_API_KEYS=${ENABLE_API_KEYS:-true}
      - OPEN_WEBUI_API_KEY=${OPEN_WEBUI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ENABLE_KB_EXEC=${ENABLE_KB_EXEC:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  oikb:
    image: ghcr.io/open-webui/oikb:latest
    container_name: oikb-rebrand
    environment:
      - OPEN_WEBUI_URL=http://open-webui-rebrand:8080
      - OPEN_WEBUI_API_KEY=${OPEN_WEBUI_API_KEY}
      - OIKB_API_KEY=${OIKB_API_KEY}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - ./oikb-data/.oikb.yaml:/data/.oikb.yaml:ro
      - ./docs:/data/docs:ro
    command: daemon
    ports:
      - ${OIKB_PORT-8081}:8080
    depends_on:
      - open-webui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
